name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OneCMonitor/OneCMonitor.csproj -r ${{ matrix.rid }}

      - name: Publish (single file, self-contained)
        run: >
          dotnet publish OneCMonitor/OneCMonitor.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1C-Server-Monitor-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error

  # Версия на Go + Fyne (каталог OneCMonitorGo).
  go-build:
    name: Go + Fyne · сборка win-x64 и win-x86
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OneCMonitorGo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: OneCMonitorGo/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fyne использует cgo; компилятор C для Windows — zig cc (тот же, которым сборка отлаживалась).
      - name: Setup zig
        run: |
          pip install ziglang==0.17.1
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$RUNNER_TEMP/bin/zig"
          chmod +x "$RUNNER_TEMP/bin/zig"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Test (логика и окно на программном рендерере)
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: файлы не отформатированы"; exit 1; }
          go vet ./internal/...
          go test -race -count=1 ./internal/...

      - name: Build win-x64 and win-x86
        run: ./build.sh

      - name: Check executables
        run: python3 ../.github/scripts/check_exe.py ../OneCServerMonitorGo-win-x64/1C-Server-Monitor-Go.exe ../OneCServerMonitorGo-win-x86/1C-Server-Monitor-Go.exe

      - name: Upload win-x64
        uses: actions/upload-artifact@v4
        with:
          name: 1C-Server-Monitor-Go-win-x64
          path: OneCServerMonitorGo-win-x64
          if-no-files-found: error

      - name: Upload win-x86
        uses: actions/upload-artifact@v4
        with:
          name: 1C-Server-Monitor-Go-win-x86
          path: OneCServerMonitorGo-win-x86
          if-no-files-found: error

  # Вызовы Windows API проверяются на настоящей Windows для обеих разрядностей.
  go-windows-test:
    name: Go · проверка на Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
    defaults:
      run:
        working-directory: OneCMonitorGo
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: OneCMonitorGo/go.sum

      - name: Test monitor (Windows API)
        run: go test -count=1 -v ./internal/monitor

      - name: Test window (шрифты Windows, программный рендерер)
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $env:SCREENSHOT_DIR = (Resolve-Path screenshots).Path
          go test -count=1 -v ./internal/ui

      - name: Upload screenshots
        if: matrix.arch == 'amd64' && always()
        uses: actions/upload-artifact@v4
        with:
          name: go-screenshots-windows
          path: OneCMonitorGo/screenshots
          if-no-files-found: warn

  # Запуск собранной программы на Windows: без OpenGL и с программным OpenGL (Mesa3D).
  go-gui:
    name: Go + Fyne · запуск окна на Windows
    needs: go-build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download win-x64
        uses: actions/download-artifact@v4
        with:
          name: 1C-Server-Monitor-Go-win-x64
          path: app

      - name: Run without Mesa
        shell: pwsh
        run: .github/scripts/run_gui.ps1 -Exe app\1C-Server-Monitor-Go.exe -Shot shots\system-opengl.png -Report

      - name: Download Mesa3D
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match '^mesa3d-[\d.]+-release-msvc\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "архив Mesa3D не найден: $($release.assets.name -join ', ')" }
          Write-Host "Mesa3D: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          Get-ChildItem mesa\x64\*.dll | ForEach-Object { Write-Host $_.Name }
          Copy-Item mesa\x64\*.dll app\

      - name: Run with Mesa
        shell: pwsh
        run: .github/scripts/run_gui.ps1 -Exe app\1C-Server-Monitor-Go.exe -Shot shots\mesa.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-gui-windows
          path: shots
          if-no-files-found: warn

  release:
    name: Release (on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, go-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 1C-Server-Monitor-*
          path: artifacts

      - name: Zip artifacts
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
