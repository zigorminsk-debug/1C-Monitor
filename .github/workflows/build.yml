name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OneCMonitor/OneCMonitor.csproj -r ${{ matrix.rid }}

      - name: Publish (single file, self-contained)
        run: >
          dotnet publish OneCMonitor/OneCMonitor.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1C-Server-Monitor-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 7

  # Версия на Go + Fyne (каталог OneCMonitorGo).
  go-build:
    name: Go + Fyne · сборка win-x64 и win-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write   # публикация предварительного выпуска go-preview
    defaults:
      run:
        working-directory: OneCMonitorGo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: OneCMonitorGo/go.sum

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fyne использует cgo; компилятор C для Windows — zig cc (тот же, которым сборка отлаживалась).
      - name: Setup zig
        run: |
          pip install ziglang==0.17.1
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' > "$RUNNER_TEMP/bin/zig"
          chmod +x "$RUNNER_TEMP/bin/zig"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Test (логика и окно на программном рендерере)
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: файлы не отформатированы"; exit 1; }
          go vet ./internal/...
          go test -race -count=1 ./internal/...

      - name: Build win-x64 and win-x86
        run: ./build.sh

      - name: Check executables
        run: python3 ../.github/scripts/check_exe.py ../OneCServerMonitorGo-win-x64/1C-Server-Monitor-Go.exe ../OneCServerMonitorGo-win-x86/1C-Server-Monitor-Go.exe

      # Передача программы заданию «запуск окна» не зависит от хранилища артефактов.
      - name: Save build for the GUI job
        uses: actions/cache/save@v4
        with:
          path: OneCServerMonitorGo-win-x64
          key: go-gui-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

      # Сборка выкладывается в Releases: на них не действует квота хранилища артефактов.
      - name: Publish pre-release go-preview
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish_preview.sh

      - name: Upload win-x64
        uses: actions/upload-artifact@v4
        with:
          name: 1C-Server-Monitor-Go-win-x64
          path: OneCServerMonitorGo-win-x64
          if-no-files-found: error
          retention-days: 7

      - name: Upload win-x86
        uses: actions/upload-artifact@v4
        with:
          name: 1C-Server-Monitor-Go-win-x86
          path: OneCServerMonitorGo-win-x86
          if-no-files-found: error
          retention-days: 7

  # Вызовы Windows API проверяются на настоящей Windows для обеих разрядностей.
  go-windows-test:
    name: Go · проверка на Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, "386"]
    defaults:
      run:
        working-directory: OneCMonitorGo
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: OneCMonitorGo/go.sum

      # Вывод тестов дублируется в аннотации запуска (скрипт go_test_report.py).
      - name: Test monitor (Windows API)
        shell: bash
        run: |
          code=0
          go test -json -count=1 -v ./internal/monitor > test-monitor.json 2> test-monitor.err || code=$?
          cat test-monitor.err
          python ../.github/scripts/go_test_report.py test-monitor.json
          exit $code

      - name: Test window (шрифты Windows, программный рендерер)
        if: matrix.arch == 'amd64' && !cancelled()
        shell: bash
        run: |
          code=0
          go test -json -count=1 -v ./internal/ui > test-ui.json 2> test-ui.err || code=$?
          cat test-ui.err
          python ../.github/scripts/go_test_report.py test-ui.json
          exit $code

  # Запуск собранной программы на Windows: без OpenGL и с программным OpenGL (Mesa3D).
  go-gui:
    name: Go + Fyne · запуск окна на Windows
    needs: go-build
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build
        uses: actions/cache/restore@v4
        with:
          path: OneCServerMonitorGo-win-x64
          key: go-gui-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Copy build
        shell: pwsh
        run: Copy-Item OneCServerMonitorGo-win-x64 app -Recurse

      - name: Run without Mesa
        shell: pwsh
        run: .github/scripts/run_gui.ps1 -Exe app\1C-Server-Monitor-Go.exe -Shot shots\1-system-opengl.png -Report -Note 'без Mesa3D'

      # Пакет MinGW: в выпуске 26.2.6 пакет MSVC собран без драйверов OpenGL (известная ошибка).
      - name: Download Mesa3D
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match '^mesa3d-[\d.]+-release-mingw\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "архив Mesa3D не найден: $($release.assets.name -join ', ')" }
          Invoke-WebRequest $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $names = (Get-ChildItem mesa\x64 -File -Filter *.dll | ForEach-Object { "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) МБ" }) -join ', '
          Write-Host "::notice title=Mesa3D::$($asset.name); каталоги: $((Get-ChildItem mesa -Directory).Name -join ', '); x64: $names"
          if (-not (Test-Path mesa\x64\opengl32.dll)) { throw 'в архиве нет x64\opengl32.dll' }

      # Варианты подключения Mesa3D проверяются по очереди; результат каждого — в аннотации.
      - name: Mesa beside the program
        shell: pwsh
        run: |
          foreach ($name in 'opengl32.dll', 'libgallium_wgl.dll', 'libglapi.dll', 'dxil.dll') {
            if (Test-Path "mesa\x64\$name") { Copy-Item "mesa\x64\$name" app\ }
          }
          .github/scripts/run_gui.ps1 -Exe app\1C-Server-Monitor-Go.exe -Shot shots\2-mesa-beside.png -Report -Note 'Mesa3D рядом с программой'

      - name: Mesa beside the program, llvmpipe
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: .github/scripts/run_gui.ps1 -Exe app\1C-Server-Monitor-Go.exe -Shot shots\3-mesa-llvmpipe.png -Report -Note 'Mesa3D рядом с программой, GALLIUM_DRIVER=llvmpipe'

      - name: Mesa beside the program, .local
        shell: pwsh
        run: |
          Set-Content app\1C-Server-Monitor-Go.exe.local 'dummy'
          .github/scripts/run_gui.ps1 -Exe app\1C-Server-Monitor-Go.exe -Shot shots\4-mesa-local.png -Report -Note 'Mesa3D рядом с программой и файл .local'

      - name: Mesa system-wide
        shell: pwsh
        run: |
          Remove-Item app\*.dll, app\*.local
          cmd /c "mesa\systemwidedeploy.cmd 1"
          $installed = (Get-ChildItem $env:windir\System32\mesadrv.dll, $env:windir\System32\libgallium_wgl.dll -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }) -join ', '
          .github/scripts/run_gui.ps1 -Exe app\1C-Server-Monitor-Go.exe -Shot shots\5-mesa-system.png -Report -Note "Mesa3D установлена в систему (systemwidedeploy.cmd 1); в System32: $installed"

      # Снимки экрана — вспомогательные: их отсутствие не делает сборку неудачной.
      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: go-gui-windows
          path: shots
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Release (on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, go-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 1C-Server-Monitor-*
          path: artifacts

      - name: Zip artifacts
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
