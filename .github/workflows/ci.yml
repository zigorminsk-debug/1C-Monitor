name: Build & Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-x86 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OneCMonitor.sln

      - name: Build Release
        run: dotnet build OneCMonitor.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test OneCMonitor.sln --configuration Release --no-build --verbosity normal

      - name: Publish 1C Watchdog (${{ matrix.rid }})
        run: >
          dotnet publish OneCWatchdog/OneCWatchdog.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/OneCWatchdog-${{ matrix.rid }}

      - name: Publish 1C Server Monitor (${{ matrix.rid }})
        run: >
          dotnet publish OneCMonitor/OneCMonitor.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/OneCServerMonitor-${{ matrix.rid }}

      - name: Bundle Watchdog & generate SHA-256 checksums
        shell: pwsh
        run: |
          $monitorDir = "artifacts/OneCServerMonitor-${{ matrix.rid }}"
          $watchdogDir = "artifacts/OneCWatchdog-${{ matrix.rid }}"
          Copy-Item "$watchdogDir/1C-Watchdog.exe" "$monitorDir/1C-Watchdog.exe" -Force

          $mExe = "$monitorDir/1C-Server-Monitor.exe"
          $wExe = "$watchdogDir/1C-Watchdog.exe"
          $mHash = (Get-FileHash -Path $mExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $wHash = (Get-FileHash -Path $wExe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$mHash  1C-Server-Monitor.exe"
            "$wHash  1C-Watchdog.exe"
          ) | Set-Content -Path "$monitorDir/SHA256.txt" -Encoding UTF8
          Get-Content "$monitorDir/SHA256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: OneCServerMonitor-${{ matrix.rid }}
          path: artifacts/OneCServerMonitor-${{ matrix.rid }}/
          retention-days: 7
          if-no-files-found: error
