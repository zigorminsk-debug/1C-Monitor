name: Build & Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-x86 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OneCMonitor.sln

      - name: Build Release
        run: dotnet build OneCMonitor.sln --configuration Release --no-restore

      - name: Publish self-contained single-file (${{ matrix.rid }})
        run: >
          dotnet publish OneCMonitor/OneCMonitor.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output artifacts/OneCServerMonitor-${{ matrix.rid }}

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "artifacts/OneCServerMonitor-${{ matrix.rid }}/1C-Server-Monitor.exe"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  1C-Server-Monitor.exe" | Set-Content -Path "artifacts/OneCServerMonitor-${{ matrix.rid }}/SHA256.txt" -Encoding UTF8
          Get-Content "artifacts/OneCServerMonitor-${{ matrix.rid }}/SHA256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneCServerMonitor-${{ matrix.rid }}
          path: artifacts/OneCServerMonitor-${{ matrix.rid }}/
          if-no-files-found: error
