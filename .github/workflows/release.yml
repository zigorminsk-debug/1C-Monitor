name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.1)'
        required: true

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Create GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build packages and checksums
        shell: pwsh
        run: .\scripts\publish.ps1 -Configuration Release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/OneCServerMonitor-win-x64.zip
            artifacts/OneCServerMonitor-win-x86.zip
            artifacts/SHA256SUMS.txt
